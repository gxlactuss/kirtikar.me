# Keeps the demo API awake.
#
# A free Hugging Face Space sleeps after 48 hours with no traffic and then
# needs 60-180s to come back. The judging window runs unannounced across a
# month, so "it was awake when we last looked" is not good enough: a judge who
# opens kirtikar.me on a quiet Tuesday has to get the live pipeline, not a
# recorded run.
#
# Pinging every 15 minutes does two things. It keeps the Space from ever
# reaching the idle threshold, and it keeps the process hot — the IS-Net model
# stays loaded, so the first real visitor does not pay for the warm-up either.
#
# It also fails loudly. A failed scheduled run emails the repository owner,
# which for an unattended month is the only way anyone finds out the API has
# stopped answering before a judge does.
name: Keep the API awake

on:
  schedule:
    # Every 15 minutes. GitHub runs scheduled workflows late under load,
    # sometimes by half an hour; that is harmless against a 48-hour idle
    # threshold and is why this is not tuned any finer.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# A queued ping is worthless once a newer one is running.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::warning::VITE_API_BASE is not set; nothing to ping."
            exit 0
          fi

          base="${API_BASE%/}"
          echo "Pinging $base/health"

          # A sleeping Space answers the first request with an HTML "starting
          # up" page and only then begins waking, so one failed attempt proves
          # nothing. Retry across roughly three minutes, which covers a normal
          # cold start, before calling it down.
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --max-time 20 "$base/health" 2>/dev/null) && {
              echo "$body"
              # Reaching the app is the point; an HTML holding page is the
              # Space's own front door and means it is still waking.
              case "$body" in
                *'"status"'*'"ok"'*)
                  echo "API is awake."
                  exit 0
                  ;;
              esac
            }
            echo "attempt $attempt: not ready yet"
            sleep 15
          done

          echo "::error::$base/health did not answer after ~3 minutes."
          exit 1
