# Checks once a day that the demo API still answers.
#
# This used to ping every 15 minutes, which was the right thing against a
# Hugging Face Space: a Space is one long-lived process that sleeps after 48
# idle hours, so frequent traffic kept it from ever sleeping AND kept the
# IS-Net model loaded in memory.
#
# Neither half of that carries over to Azure Container Apps. With
# min-replicas 0 the replica is scaled away a few minutes after the last
# request no matter how often you ping, so the pings buy no warmth. And
# holding one up instead -- min-replicas 1 -- means a 1 vCPU / 2GiB replica
# billed around the clock, roughly 2.6M vCPU-seconds a month against a free
# grant of 180K, which is about $30-40 a month for a demo that otherwise
# costs nothing.
#
# So this is a liveness check, not a keep-alive. What it still buys is the
# thing that matters for an unattended month: a failed scheduled run emails the
# repository owner, which is the only way anyone learns the API has stopped
# answering before a judge does.
#
# Cold starts are covered elsewhere. The site's scroll intro gives the
# replica a head start, and src/machine/run.ts replays a recorded run on any
# failure, labelled "Demo data" with the reason.
name: Check the API answers

on:
  schedule:
    # Once a day, a few minutes past the hour. GitHub runs scheduled workflows
    # late under load; nothing here is time-sensitive to within hours.
    - cron: '7 3 * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::warning::VITE_API_BASE is not set; nothing to ping."
            exit 0
          fi

          base="${API_BASE%/}"
          echo "Pinging $base/health"

          # A cold replica has to be scheduled, pull the image and import the
          # app before it answers, which takes up to a minute. Retry across
          # roughly three minutes before calling it down.
          for attempt in $(seq 1 12); do
            body=$(curl -fsS --max-time 20 "$base/health" 2>/dev/null) && {
              echo "$body"
              case "$body" in
                *'"status"'*'"ok"'*)
                  echo "API is answering."
                  exit 0
                  ;;
              esac
            }
            echo "attempt $attempt: not ready yet"
            sleep 15
          done

          echo "::error::$base/health did not answer after ~3 minutes."
          exit 1
