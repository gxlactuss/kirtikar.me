# Builds backend/ and deploys it to Azure Container Apps, which serves the demo API.
#
# The image is built from backend/Dockerfile on the runner and pushed to ACR.
# Not `az acr build`: Azure for Students refuses ACR Tasks outright
# (TasksOperationsNotAllowed). The same Dockerfile that ran on a
# Hugging Face Space runs unchanged: it already listens on 7860 and runs as
# uid 1000, and the container app's ingress is pointed at 7860 when it is
# first created.
#
# Needs, in repository settings (all variables, no secrets -- see below):
#   AZURE_CLIENT_ID        app registration used by this workflow
#   AZURE_TENANT_ID        the directory that app lives in
#   AZURE_SUBSCRIPTION_ID  f3849fe0-171c-4378-81ce-3c1769804ed0
#   AZURE_REGISTRY         the ACR name, without .azurecr.io
#
# Login is OIDC: GitHub mints a short-lived token for this repository and
# Azure trades it for one, against a federated credential on the app
# registration. There is no client secret anywhere, which is the whole point --
# a long-lived deployer credential sitting in a repository secret was the one
# thing the Cloud Run setup this replaced never had a good answer for.
#
# The API keys are NOT set here. They are container app secrets, set once by
# hand and referenced below as `secretref:`, so rotating one is a single
# `az containerapp secret set` and a redeploy rather than a change to this
# file -- and so they never sit in this repository's history.
#
# The app itself is created by hand once (DEPLOY.md, step 5), because creating
# it requires the API keys. This workflow only ever updates an app that exists.
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

# id-token is what lets azure/login exchange a GitHub OIDC token for an Azure
# one. Without it the login step fails with a confusing "no credentials".
permissions:
  id-token: write
  contents: read

# Names are fixed here rather than being repository variables: they only have
# to be unique inside one subscription, and having them in the file means the
# deploy reads the same as the setup in DEPLOY.md. The registry is a variable
# because an ACR name is globally unique and cannot be guessed in advance.
env:
  RESOURCE_GROUP: kirtikar-rg
  APP_NAME: kirtikar-api
  IMAGE_NAME: kirtikar-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy is configured
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          REGISTRY: ${{ vars.AZURE_REGISTRY }}
        run: |
          missing=
          [ -z "$CLIENT_ID" ] && missing="$missing AZURE_CLIENT_ID"
          [ -z "$TENANT_ID" ] && missing="$missing AZURE_TENANT_ID"
          [ -z "$SUBSCRIPTION_ID" ] && missing="$missing AZURE_SUBSCRIPTION_ID"
          [ -z "$REGISTRY" ] && missing="$missing AZURE_REGISTRY"
          if [ -n "$missing" ]; then
            echo "::error::Not configured. Missing:$missing -- see DEPLOY.md"
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The containerapp commands live in an extension that is not in the
      # runner's preinstalled CLI. Installing it explicitly keeps a surprise
      # "extension not installed" prompt out of the middle of a deploy.
      - name: Install the containerapp extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      # Fail here, with something actionable, rather than three minutes later
      # after a build whose image has nowhere to go.
      - name: Check the app exists
        run: |
          if ! az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" -o none 2>/dev/null; then
            echo "::error::Container app $APP_NAME not found in $RESOURCE_GROUP. Create it once by hand -- DEPLOY.md, step 5."
            exit 1
          fi

      # The context is backend/, so the image is built from exactly the tree
      # this commit has, and it is tagged with the commit so a revision in the
      # portal can be traced back to a line of code. `az acr login` signs
      # Docker in with the OIDC session, which is what the AcrPush role is for.
      - name: Build and push the image
        env:
          REGISTRY: ${{ vars.AZURE_REGISTRY }}
        run: |
          az acr login --name "$REGISTRY"
          image="$REGISTRY.azurecr.io/$IMAGE_NAME"
          docker build --file backend/Dockerfile \
            --tag "$image:$GITHUB_SHA" --tag "$image:latest" backend
          docker push --all-tags "$image"

      # Every flag below is load-bearing; DEPLOY.md says which breaks what.
      - name: Deploy to Container Apps
        env:
          REGISTRY: ${{ vars.AZURE_REGISTRY }}
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY.azurecr.io/$IMAGE_NAME:$GITHUB_SHA" \
            --cpu 2 --memory 4Gi \
            --min-replicas 0 \
            --max-replicas 1 \
            --set-env-vars \
              'CORS_ORIGINS=https://kirtikar.me,https://www.kirtikar.me,http://localhost:5173' \
              'SARVAM_API_KEY=secretref:sarvam-api-key' \
              'GEMINI_API_KEY=secretref:gemini-api-key' \
              'GEMINI_MODEL=gemini-3-flash-preview' \
              'GEMINI_FALLBACK_MODELS=gemini-3.1-flash-lite' \
              'GEMINI_TIMEOUT_SECONDS=45' \
              'PIPELINE_MAX_STAGE_ATTEMPTS=2' \
            --output none

          fqdn=$(az containerapp show \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)
          echo "https://$fqdn"
